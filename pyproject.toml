[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mubu-web-mcp"
description = "MCP server that lets AI agents (Codex, Claude, Cursor...) read and create Mubu (幕布) outlines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "miaoteam" }]
keywords = ["mcp", "model-context-protocol", "mubu", "幕布", "outliner", "notes", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Operating System :: OS Independent",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/miaoteam/mubu_web_mcp"
Repository = "https://github.com/miaoteam/mubu_web_mcp"
Issues = "https://github.com/miaoteam/mubu_web_mcp/issues"
Changelog = "https://github.com/miaoteam/mubu_web_mcp/blob/main/CHANGELOG.md"

[project.scripts]
mubu-web-mcp = "mubu_web_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mubu_web_mcp.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
